worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    # Writable paths for the unprivileged runtime. / 비관리자 실행을 위한 임시 경로입니다.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        # Preserve the public host and port behind container mappings.
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;

        # Revalidate HTML so deployments reference the latest assets. / HTML은 최신 빌드를 재확인합니다.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location ^~ /_next/static/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Preserve the browser origin for Django's CSRF checks. / CSRF 검증용 호스트를 유지합니다.
        location = /api { return 404; }
        location ^~ /api/ {
            proxy_pass ${BACKEND_ORIGIN};
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 20s;
            proxy_next_upstream off;
            client_max_body_size 16k;
            add_header Cache-Control "no-store" always;
        }

        location ~ /\. {
            deny all;
        }

        # Missing static files return 404. / 없는 정적 파일은 HTML 대신 404를 반환합니다.
        location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|txt|xml|webmanifest)$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        error_page 404 /404.html;

        location = /tentang-kami { return 301 /#about; }
        location = /kurikulum { return 301 /#curriculum; }
        location = /institusi-mitra { return 301 /#partners; }
        location = /contact { return 301 /#contact; }

        location / {
            try_files $uri $uri/ $uri.html =404;
            add_header Cache-Control "no-cache";
        }
    }
}
