[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
childlogdir=/tmp

[program:backend]
command=gunicorn -c /app/deploy/gunicorn.conf.py config.wsgi:application
directory=/app/backend
environment=GUNICORN_BIND="127.0.0.1:8000"
autorestart=false
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=sh /usr/local/bin/start-nginx.sh
autorestart=false
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:watch]
command=python /app/deploy/watch-processes.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
buffer_size=10
priority=1
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
